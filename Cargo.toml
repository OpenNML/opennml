[workspace]
resolver = "3"
members = ["crates/opennml-rda", "crates/opennml-formats", "crates/opennml-world", "crates/opennml-export", "tools/opennml-extract", "crates/opennml-render", "apps/opennml-viewer", "crates/opennml-control", "apps/opennml-viewer-mcp", "crates/opennml-effects", "crates/opennml-audio", "crates/opennml-bink", "crates/opennml-sim", "crates/opennml-ui", "crates/opennml-client", "apps/opennml-game", "crates/opennml-randommap", "crates/opennml-net", "tools/opennml-icon", "tools/opennml-release"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"
repository = "https://github.com/OpenNML/opennml"

[workspace.dependencies]
opennml-rda = { path = "crates/opennml-rda" }
winreg = "0.56"
rfd = "0.18"
opennml-formats = { path = "crates/opennml-formats" }
opennml-world = { path = "crates/opennml-world" }
opennml-export = { path = "crates/opennml-export" }
opennml-render = { path = "crates/opennml-render" }
opennml-control = { path = "crates/opennml-control" }
opennml-effects = { path = "crates/opennml-effects" }
opennml-audio = { path = "crates/opennml-audio" }
opennml-bink = { path = "crates/opennml-bink" }
opennml-sim = { path = "crates/opennml-sim" }
opennml-net = { path = "crates/opennml-net" }
opennml-ui = { path = "crates/opennml-ui" }
opennml-client = { path = "crates/opennml-client" }
opennml-randommap = { path = "crates/opennml-randommap" }
glam = "0.34"
serde_json = "1"
gltf = "1.4"
flate2 = "1.1"
encoding_rs = "0.8"
thiserror = "2"
anyhow = "1"
tempfile = "3"
clap = { version = "4.6", features = ["derive"] }
glob = "0.3"
image = { version = "0.25", default-features = false, features = ["tga", "png"] }
wgpu = "30"
winit = "0.30"
pollster = "1"
serde = { version = "1", features = ["derive"] }
bytemuck = { version = "1", features = ["derive"] }
toml = "1"
log = "0.4"
env_logger = "0.11"
rmcp = { version = "=3.5.1", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "process", "time", "sync"] }
schemars = "1"
symphonia = { version = "0.6", default-features = false, features = ["ogg", "vorbis"] }
cpal = "0.18"
# DirectSound driver list of the sound options; same version as in cpal.
windows = "0.62"
postcard = { version = "1.1", default-features = false, features = ["use-std"] }
egui = { version = "0.36.2", default-features = false, features = ["default_fonts"] }
egui-wgpu = { version = "0.36.2", default-features = false }
egui-winit = { version = "0.36.2", default-features = false }
embed-resource = "3"

# Optimize dependencies in the debug build too: zlib is otherwise very slow in corpus tests.
[profile.dev.package."*"]
opt-level = 2

# The Bink decoder also runs optimized in debug tests and in the debug game.
[profile.dev.package.opennml-bink]
opt-level = 2

# Profile of the release archive (`dist`): the release profile with one codegen unit and line tables in the PDB.
# LTO is thin: fat LTO made the exe only 3.1 % smaller (21.3 MB instead of 22.0 MB) and the build twice as slow.
[profile.dist]
inherits = "release"
codegen-units = 1
debug = "line-tables-only"
lto = "thin"
