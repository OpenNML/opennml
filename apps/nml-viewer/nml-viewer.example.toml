# Copy to nml-viewer.toml in the working directory (or pass --config <path>).
backend = "auto"          # auto | vulkan | dx12
window_mode = "borderless" # windowed | borderless | exclusive
# monitor = 0             # 0-based; if omitted: the monitor the window is on
width = 1280               # window size in windowed mode and size of --screenshot (logical pixels)
height = 720
# game_dir = "C:/Games/No Man's Land"   # if omitted: NML_GAME_DIR or ../original/No Man's Land
level = "data/levels/kampagne1/kamp1-1/kamp1-1.lvl"
aspect = "correct"         # correct | original43 | stretch (original: AspectRatio 1, stretched)
fog = false                # fog (switched by an event in the game, default off)
animate = true             # objects play their idle animation (F5)
shadow_quality = 2         # Engine.ini ShadowQuality 0–3
particles_quality = 2      # Engine.ini ParticlesQuality 0–2
terrain_quality = 0        # Engine.ini TerrainQuality 0–2 (from 2: water in detail texture mode)
light = "start"            # start (as in the game) | level (.wld) | name from lightdata.ini (F6)
weather = "start"          # start (as in the game) | none | rain | snow (F7)
volume_music = 349         # Engine.ini m_Volumes 0–1000: music
volume_sfx = 599           # sound effects
volume_speech = 499        # speech
mute = false               # no device output (F9); the mixer and --audio-capture keep running
unit_response = true       # Engine.ini UnitResponse: unit selection voice and command acknowledgement
game_speed = 14            # Engine.ini GameSpeed 0–30: game time = clock time · (n + 10) / 20
# game_mode = 0            # −1 campaign, 0 normal, 1 kill hero, 3 King of the Hill, 4/5 Railroad (if omitted: multiplayer map 0, otherwise −1)
seed = 0                   # start index of the simulation's random sequence (original 0)
nations = []               # nations of the lobby slots, e.g. ["SPA", "ENG"]; empty = those of the .lvl
teams = []                 # teams of the lobby slots, e.g. [0, 0, 1, 1]; empty = everyone on their own
resource_setting = 0       # starting balance: 0 = the map's, 1–3 = stages of resourcenconfig.ini
living_space = 2           # living space 0–5 = 75, 100, 125, 150, 175, 200
map_explored = false       # map explored (MapExplored): fully set to "explored" at the start
ki_enabled = true          # start the AI of the AI slots (default on; command line --ki on|off)
campaign_difficulty = 1    # campaign difficulty 0–2 (command line --campaign-difficulty)
script_enabled = false     # start the level script (.abl) (default off; sim_setup script_enabled)
time_per_char = 55         # speaking time per character without a speech file in ms, 1–1000 (Engine.ini TimePerChar)
# time_limit = 20           # time limit in minutes, 1–35791 (game type 2/3 victory time, game type 4 time limit; if omitted 20)
# Lobby slots instead of nations/teams (command line --slots h,a3,h,a3), one entry per slot:
# [[slots]]
# kind = "ai"              # closed | human | ai
# nation = 1               # 0–5 (WID, PRI, SPA, SID, ENG, PAT)
# team = 1
# color = 1                # 0–8 (8 = white)
# ki_kind = 3              # AI kind 1–4 (handicap 5/2/0/0) or instead handicap = 0–5

[controls]                 # like the values of the same name in Engine.ini
mouse_scroll = 10          # edge scrolling: speed (n + 1) · 0.1
keyboard_scroll = 10       # key scrolling: speed (n + 1) · 0.1
enable_mouse_scroll = true
lock_camera = true         # locks rotation (Ins/Del)
enable_zoom = true         # mouse wheel zoom
double_click_ms = 200      # double click: maximum interval between releases in ms (DoubleClickTimeout)
